name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: unzip -o SONGDNA_Studio_1_7_IntroDNA_Expanded.zip && mv SONGDNA_Studio_1_7_IntroDNA_Expanded/* . || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        run: gradle -p android-wrapper assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-apk
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk  
